<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Chat — AI Assistant</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310a37f'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <span class="brand-logo">✦</span>
          <span>Nova Chat</span>
        </div>
        <button type="button" id="new-chat-btn" class="btn-new-chat">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
      </div>

      <nav class="chat-list" id="chat-list" aria-label="Chat history"></nav>

      <div class="sidebar-bottom">
        <button type="button" id="theme-toggle" class="icon-btn wide">
          <svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span id="theme-label">Light mode</span>
        </button>
        <button type="button" id="clear-all-btn" class="icon-btn wide danger">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
          Clear conversations
        </button>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <button type="button" id="menu-btn" class="icon-btn" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="model-chip">
          Nova
          <span class="model-version">1.5 · demo</span>
          <span class="model-dot" aria-hidden="true"></span>
        </div>
        <button type="button" id="top-new-chat" class="icon-btn" aria-label="New chat">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </header>

      <section class="chat-window" id="chat-window">
        <div class="welcome" id="welcome">
          <div class="welcome-logo">✦</div>
          <h1>How can I help you today?</h1>
          <div class="suggestions" id="suggestions">
            <button type="button" class="suggestion-card" data-prompt="Explain quantum computing in simple terms">
              <span class="suggestion-icon">🌌</span>
              <span class="suggestion-title">Explain quantum computing</span>
              <span class="suggestion-sub">In simple, everyday terms</span>
            </button>
            <button type="button" class="suggestion-card" data-prompt="Write a JavaScript debounce function with an example">
              <span class="suggestion-icon">⚡</span>
              <span class="suggestion-title">Write a JS debounce function</span>
              <span class="suggestion-sub">With a practical example</span>
            </button>
            <button type="button" class="suggestion-card" data-prompt="Plan a weekend trip to the mountains">
              <span class="suggestion-icon">🏔️</span>
              <span class="suggestion-title">Plan a mountain trip</span>
              <span class="suggestion-sub">Weekend itinerary ideas</span>
            </button>
            <button type="button" class="suggestion-card" data-prompt="Tell me a fun fact I probably don't know">
              <span class="suggestion-icon">💡</span>
              <span class="suggestion-title">Tell me a fun fact</span>
              <span class="suggestion-sub">Something surprising</span>
            </button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer">
        <form id="chat-form" autocomplete="off">
          <div class="input-box">
            <textarea id="prompt-input" rows="1" placeholder="Message Nova…" aria-label="Message"></textarea>
            <button type="submit" id="send-btn" class="send-btn" disabled aria-label="Send message">
              <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg class="icon-stop" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
            </button>
          </div>
        </form>
        <p class="disclaimer">Powered by the free <a href="https://pollinations.ai" target="_blank" rel="noopener">Pollinations.ai</a> API — messages are sent to their service to generate replies.</p>
      </footer>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
